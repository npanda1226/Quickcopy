<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QuickCopy</title>
<meta name="application-name" content="QuickCopy"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="QuickCopy"/>
<meta name="theme-color" content="#0a0f1e"/>
<meta name="description" content="원클릭 클립보드 매니저 — QuickCopy"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link rel="icon" type="image/png" href="icon-192.png"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
/* ══════════════════════════════════
   디자인 토큰 — 다크 네이비
══════════════════════════════════ */
:root {
  --bg          : #0a0f1e;
  --bg2         : #0f1628;
  --surface     : #141d35;
  --card        : #1a2440;
  --card-hover  : #1f2b4a;
  --border      : rgba(100,160,255,0.12);
  --border-hi   : rgba(100,160,255,0.35);
  --accent      : #4d8fff;
  --accent-2    : #7eb8ff;
  --accent-glow : rgba(77,143,255,0.18);
  --accent-dim  : rgba(77,143,255,0.08);
  --danger      : #ff5e72;
  --success     : #4dffa6;
  --text        : #e8f0ff;
  --text-2      : #8fa8d0;
  --text-muted  : #445878;
  --font-d      : 'Syne', sans-serif;
  --font-b      : 'DM Sans', sans-serif;
  --r           : 14px;
  --r-sm        : 9px;
  --tr          : 0.2s cubic-bezier(0.4,0,0.2,1);
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { height:100%; }
body {
  font-family: var(--font-b);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex; flex-direction: column;
  /* 배경 그리드 패턴 */
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(77,143,255,0.12) 0%, transparent 70%),
    linear-gradient(rgba(100,160,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(100,160,255,0.03) 1px, transparent 1px);
  background-size: 100% 100%, 40px 40px, 40px 40px;
}

/* ══ 헤더 ══ */
header {
  position: sticky; top: 0; z-index: 100;
  padding: 0 20px;
  height: 60px;
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(10,15,30,0.8);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}

.logo {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-d); font-weight: 800;
  font-size: 1.05rem; letter-spacing: -0.3px;
  color: var(--text);
}
.logo-icon {
  width: 32px; height: 32px; border-radius: 9px;
  background: linear-gradient(135deg, #1a3a7a, #2a5abf);
  border: 1px solid var(--border-hi);
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem;
  box-shadow: 0 0 16px rgba(77,143,255,0.2);
}

/* 모드 토글 */
.mode-toggle {
  display: flex;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px; padding: 3px; gap: 2px;
}
.mode-btn {
  padding: 6px 16px; border-radius: 8px; border: none;
  background: transparent; color: var(--text-muted);
  font-family: var(--font-b); font-size: 0.82rem; font-weight: 600;
  cursor: pointer; transition: all var(--tr);
  display: flex; align-items: center; gap: 5px;
}
.mode-btn:hover { color: var(--text-2); }
.mode-btn.active {
  background: linear-gradient(135deg, #1a3a7a, #2a5abf);
  color: #fff;
  box-shadow: 0 2px 12px rgba(77,143,255,0.3);
}

/* ══ 메인 ══ */
main {
  flex: 1; padding: 20px;
  max-width: 680px; margin: 0 auto; width: 100%;
}

/* ══ 카테고리 블록 ══ */
.category-block { margin-bottom: 32px; }

.category-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.category-title {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-d); font-size: 0.7rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 2.5px;
  color: var(--accent-2);
}
.category-title-bar {
  width: 20px; height: 2px;
  background: linear-gradient(90deg, var(--accent), transparent);
  border-radius: 1px;
}
.category-count {
  font-size: 0.68rem; padding: 2px 8px;
  background: var(--accent-dim); border: 1px solid var(--border);
  border-radius: 20px; color: var(--text-muted);
  font-family: var(--font-b); font-weight: 500;
}
.category-actions { display: flex; gap: 4px; }
.icon-btn {
  width: 28px; height: 28px; border-radius: 7px;
  background: transparent; border: 1px solid var(--border);
  color: var(--text-muted); cursor: pointer; font-size: 0.78rem;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--tr);
}
.icon-btn:hover       { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
.icon-btn.danger:hover{ border-color: var(--danger);  color: var(--danger);  background: rgba(255,94,114,0.08); }

/* ══ 문장 카드 ══ */
.phrase-list { display: flex; flex-direction: column; gap: 6px; }

.phrase-card {
  position: relative; overflow: hidden;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
  cursor: pointer;
  transition: all var(--tr);
  user-select: none;
}
/* 왼쪽 글로우 라인 */
.phrase-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px;
  background: linear-gradient(180deg, var(--accent), var(--accent-2));
  transform: scaleY(0); transform-origin: center;
  transition: transform var(--tr);
  border-radius: 0 2px 2px 0;
}
/* 배경 글로우 */
.phrase-card::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, var(--accent-glow), transparent);
  opacity: 0; transition: opacity var(--tr);
}
.phrase-card:hover {
  border-color: var(--border-hi);
  background: var(--card-hover);
  transform: translateX(2px);
}
.phrase-card:hover::before { transform: scaleY(1); }
.phrase-card:hover::after  { opacity: 1; }
.phrase-card:active        { transform: scale(0.985) translateX(0); }

.phrase-text {
  flex: 1; font-size: 0.88rem; line-height: 1.55;
  color: var(--text); word-break: break-all;
  position: relative; z-index: 1;
}
.copy-hint {
  flex-shrink: 0; position: relative; z-index: 1;
  display: flex; align-items: center; gap: 5px;
  font-size: 0.7rem; font-weight: 600; letter-spacing: 0.3px;
  color: var(--text-muted);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 9px;
  transition: all var(--tr);
}
.phrase-card:hover .copy-hint {
  background: var(--accent-dim);
  border-color: var(--border-hi);
  color: var(--accent-2);
}

/* 복사 완료 상태 */
.phrase-card.copied {
  border-color: rgba(77,255,166,0.4);
  background: rgba(77,255,166,0.05);
  transform: translateX(2px);
}
.phrase-card.copied::before {
  transform: scaleY(1);
  background: var(--success);
}
.phrase-card.copied .copy-hint {
  background: rgba(77,255,166,0.1);
  border-color: rgba(77,255,166,0.3);
  color: var(--success);
}

/* ══ 설정 모드 카드 ══ */
.phrase-card.edit-mode {
  cursor: default;
}
.phrase-card.edit-mode:hover {
  transform: none;
  border-color: var(--border);
  background: var(--card);
}
.phrase-card.edit-mode:hover::before { transform: scaleY(0); }
.phrase-card.edit-mode:hover::after  { opacity: 0; }

.edit-actions { display: flex; gap: 4px; flex-shrink: 0; z-index: 1; }
.edit-btn {
  width: 28px; height: 28px; border-radius: 7px;
  background: transparent; border: 1px solid var(--border);
  color: var(--text-muted); cursor: pointer; font-size: 0.78rem;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--tr);
}
.edit-btn:hover       { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
.edit-btn.del:hover   { border-color: var(--danger);  color: var(--danger);  background: rgba(255,94,114,0.08); }

/* ══ 추가 버튼 ══ */
.add-phrase-btn {
  width: 100%; padding: 10px;
  background: transparent;
  border: 1px dashed rgba(77,143,255,0.2);
  border-radius: var(--r);
  color: rgba(77,143,255,0.4);
  font-family: var(--font-b); font-size: 0.82rem; font-weight: 600;
  cursor: pointer; transition: all var(--tr);
  display: flex; align-items: center; justify-content: center; gap: 6px;
  margin-top: 6px;
}
.add-phrase-btn:hover {
  border-color: var(--accent); color: var(--accent);
  background: var(--accent-dim);
}

.add-category-btn {
  width: 100%; padding: 14px;
  background: transparent;
  border: 1px dashed var(--border);
  border-radius: var(--r);
  color: var(--text-muted);
  font-family: var(--font-b); font-size: 0.85rem; font-weight: 600;
  cursor: pointer; transition: all var(--tr);
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin-top: 8px;
}
.add-category-btn:hover {
  border-color: var(--accent); color: var(--accent);
  background: var(--accent-dim);
}

/* ══ 인라인 입력 ══ */
.inline-input-wrap {
  background: var(--surface);
  border: 1px solid var(--accent);
  border-radius: var(--r);
  padding: 12px 14px;
  display: flex; gap: 8px; align-items: flex-start;
  margin-top: 6px;
  box-shadow: 0 0 20px rgba(77,143,255,0.1);
  animation: fadeSlide 0.15s ease;
}
@keyframes fadeSlide {
  from { opacity:0; transform:translateY(-6px); }
  to   { opacity:1; transform:translateY(0); }
}
.inline-input {
  flex:1; background:transparent; border:none; outline:none;
  color:var(--text); font-family:var(--font-b); font-size:0.88rem;
  resize:none; line-height:1.5; min-height:38px;
}
.inline-input::placeholder { color: var(--text-muted); }
.inline-save {
  padding: 7px 16px; border-radius: var(--r-sm); border: none;
  background: linear-gradient(135deg, #1a3a7a, #2a5abf);
  color: #fff; font-family: var(--font-b);
  font-size: 0.8rem; font-weight: 700;
  cursor: pointer; flex-shrink: 0;
  transition: opacity var(--tr);
  box-shadow: 0 2px 10px rgba(77,143,255,0.25);
}
.inline-save:hover { opacity: 0.85; }
.inline-cancel {
  padding: 7px 10px; border-radius: var(--r-sm);
  border: 1px solid var(--border); background: transparent;
  color: var(--text-muted); font-size: 0.8rem;
  cursor: pointer; flex-shrink: 0; transition: all var(--tr);
}
.inline-cancel:hover { border-color: var(--danger); color: var(--danger); }

/* ══ 빈 상태 ══ */
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--text-muted);
}
.empty-state-icon { font-size: 3rem; margin-bottom: 14px; opacity: 0.5; }
.empty-state h3 {
  font-family: var(--font-d); font-size: 1rem;
  color: var(--text-2); margin-bottom: 6px;
}
.empty-state p { font-size: 0.82rem; line-height: 1.6; }

/* ══ 검색바 ══ */
.search-wrap {
  position: relative; margin-bottom: 20px;
}
.search-input {
  width: 100%; padding: 11px 16px 11px 40px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); color: var(--text);
  font-family: var(--font-b); font-size: 0.88rem;
  outline: none; transition: border-color var(--tr);
}
.search-input:focus { border-color: var(--border-hi); }
.search-input::placeholder { color: var(--text-muted); }
.search-icon {
  position: absolute; left: 14px; top: 50%;
  transform: translateY(-50%); color: var(--text-muted);
  font-size: 0.9rem; pointer-events: none;
}
.search-count {
  position: absolute; right: 12px; top: 50%;
  transform: translateY(-50%);
  font-size: 0.72rem; color: var(--text-muted);
}

/* ══ 토스트 ══ */
#copyToast {
  position: fixed; bottom: 28px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: linear-gradient(135deg, #1a3a7a, #2a5abf);
  border: 1px solid var(--border-hi);
  color: #fff; font-family: var(--font-b);
  font-size: 0.82rem; font-weight: 600;
  padding: 10px 20px; border-radius: 20px;
  opacity: 0; transition: all 0.25s ease;
  pointer-events: none; white-space: nowrap;
  box-shadow: 0 4px 24px rgba(77,143,255,0.35);
  display: flex; align-items: center; gap: 8px;
}
#copyToast.show {
  opacity: 1; transform: translateX(-50%) translateY(0);
}

/* ══ 반응형 ══ */
@media (max-width: 480px) {
  header { padding: 0 14px; }
  main   { padding: 14px; }
  .mode-btn { padding: 5px 11px; font-size: 0.78rem; }
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">📋</div>
    QuickCopy
  </div>
  <div class="mode-toggle">
    <button class="mode-btn active" id="btnRun"  onclick="setMode('run')">▶ 실행</button>
    <button class="mode-btn"        id="btnEdit" onclick="setMode('edit')">⚙ 설정</button>
  </div>
</header>

<main id="mainContent"></main>

<div id="copyToast">
  <span>✓</span><span>복사됨</span>
</div>

<script>
// ══ 데이터 ══
let data = JSON.parse(localStorage.getItem('qc_data') || 'null') || [
  {
    id: 1, name: '인사',
    phrases: [
      { id: 11, text: '안녕하세요! 반갑습니다 😊' },
      { id: 12, text: '잘 부탁드립니다.' },
    ]
  },
  {
    id: 2, name: '업무',
    phrases: [
      { id: 21, text: '확인 후 회신드리겠습니다.' },
      { id: 22, text: '감사합니다. 수고하셨습니다!' },
    ]
  }
];

let mode    = 'run';
let nextId  = 200;
let query   = '';

function save() { localStorage.setItem('qc_data', JSON.stringify(data)); }

// ══ 모드 전환 ══
function setMode(m) {
  mode = m;
  document.getElementById('btnRun').classList.toggle('active',  m === 'run');
  document.getElementById('btnEdit').classList.toggle('active', m === 'edit');
  render();
}

// ══ 검색 필터 ══
function filterData() {
  if (!query) return data;
  const q = query.toLowerCase();
  return data.map(cat => ({
    ...cat,
    phrases: cat.phrases.filter(p => p.text.toLowerCase().includes(q))
  })).filter(cat => cat.phrases.length > 0);
}

// ══ 렌더 ══
function render() {
  const main    = document.getElementById('mainContent');
  const visible = filterData();
  const total   = visible.reduce((s,c) => s + c.phrases.length, 0);

  let html = '';

  // 검색바
  html += `
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" type="text" placeholder="문장 검색..."
             value="${escHtml(query)}"
             oninput="query=this.value;render()" />
      ${query ? `<span class="search-count">${total}개</span>` : ''}
    </div>
  `;

  if (!data.length) {
    html += `
      <div class="empty-state">
        <div class="empty-state-icon">📋</div>
        <h3>카테고리가 없습니다</h3>
        <p>설정 모드에서 카테고리와 문장을 추가해보세요</p>
      </div>
    `;
    if (mode === 'edit') html += `<button class="add-category-btn" onclick="addCategory()">＋ 카테고리 추가</button>`;
  } else if (!visible.length && query) {
    html += `
      <div class="empty-state">
        <div class="empty-state-icon">🔍</div>
        <h3>검색 결과 없음</h3>
        <p>"${escHtml(query)}"에 해당하는 문장이 없습니다</p>
      </div>
    `;
  } else {
    html += visible.map(cat => renderCategory(cat)).join('');
    if (mode === 'edit') html += `<button class="add-category-btn" onclick="addCategory()">＋ 카테고리 추가</button>`;
  }

  main.innerHTML = html;
}

function renderCategory(cat) {
  const phrases = cat.phrases.map(p => renderPhrase(cat.id, p)).join('');
  const editCtrl = mode === 'edit' ? `
    <div class="category-actions">
      <button class="icon-btn"        onclick="renameCategory(${cat.id})">✏</button>
      <button class="icon-btn danger" onclick="deleteCategory(${cat.id})">🗑</button>
    </div>` : '';

  const addBtn = mode === 'edit'
    ? `<button class="add-phrase-btn" onclick="showAddPhrase(${cat.id})">＋ 문장 추가</button>` : '';

  return `
    <div class="category-block" id="cat-${cat.id}">
      <div class="category-header">
        <div class="category-title">
          <div class="category-title-bar"></div>
          ${escHtml(cat.name)}
          <span class="category-count">${cat.phrases.length}</span>
        </div>
        ${editCtrl}
      </div>
      <div class="phrase-list" id="phrases-${cat.id}">
        ${phrases}
        <div id="add-input-${cat.id}"></div>
      </div>
      ${addBtn}
    </div>
  `;
}

function renderPhrase(catId, p) {
  if (mode === 'run') {
    return `
      <div class="phrase-card" id="card-${p.id}"
           onclick="copyPhrase('${escAttr(p.text)}', ${p.id})">
        <div class="phrase-text">${escHtml(p.text)}</div>
        <div class="copy-hint">복사</div>
      </div>`;
  } else {
    return `
      <div class="phrase-card edit-mode">
        <div class="phrase-text">${escHtml(p.text)}</div>
        <div class="edit-actions">
          <button class="edit-btn"     onclick="editPhrase(${catId},${p.id})">✏</button>
          <button class="edit-btn del" onclick="deletePhrase(${catId},${p.id})">✕</button>
        </div>
      </div>`;
  }
}

// ══ 복사 ══
let toastTimer = null;
function copyPhrase(text, id) {
  const decoded = text.replace(/\\n/g, '\n').replace(/\\'/g, "'");
  navigator.clipboard.writeText(decoded).then(() => feedback(id))
    .catch(() => {
      const ta = document.createElement('textarea');
      ta.value = decoded; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy');
      document.body.removeChild(ta); feedback(id);
    });
}

function feedback(id) {
  const card = document.getElementById('card-' + id);
  if (card) {
    card.classList.add('copied');
    const hint = card.querySelector('.copy-hint');
    if (hint) hint.textContent = '복사됨 ✓';
    setTimeout(() => {
      card.classList.remove('copied');
      if (hint) hint.textContent = '복사';
    }, 1300);
  }
  const t = document.getElementById('copyToast');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1500);
}

// ══ 카테고리 ══
function addCategory() {
  const name = prompt('카테고리 이름');
  if (!name?.trim()) return;
  data.push({ id: ++nextId, name: name.trim(), phrases: [] });
  save(); render();
}
function renameCategory(id) {
  const cat = data.find(c => c.id === id);
  if (!cat) return;
  const name = prompt('새 이름', cat.name);
  if (!name?.trim()) return;
  cat.name = name.trim(); save(); render();
}
function deleteCategory(id) {
  if (!confirm('카테고리와 모든 문장을 삭제할까요?')) return;
  data = data.filter(c => c.id !== id); save(); render();
}

// ══ 문장 추가 ══
function showAddPhrase(catId) {
  const wrap = document.getElementById('add-input-' + catId);
  if (!wrap) return;
  if (wrap.innerHTML) { wrap.innerHTML = ''; return; }
  wrap.innerHTML = `
    <div class="inline-input-wrap">
      <textarea class="inline-input" id="newPhrase-${catId}"
        placeholder="문장 입력 (Enter 저장, Shift+Enter 줄바꿈)"
        rows="2"
        onkeydown="handleKey(event,${catId})"></textarea>
      <button class="inline-save"   onclick="savePhrase(${catId})">저장</button>
      <button class="inline-cancel" onclick="cancelPhrase(${catId})">✕</button>
    </div>`;
  setTimeout(() => document.getElementById('newPhrase-'+catId)?.focus(), 50);
}
function handleKey(e, catId) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); savePhrase(catId); }
  if (e.key === 'Escape') cancelPhrase(catId);
}
function savePhrase(catId) {
  const input = document.getElementById('newPhrase-' + catId);
  const text  = input?.value.trim();
  if (!text) { input?.focus(); return; }
  const cat = data.find(c => c.id === catId);
  if (!cat) return;
  cat.phrases.push({ id: ++nextId, text }); save(); render();
}
function cancelPhrase(catId) {
  const el = document.getElementById('add-input-' + catId);
  if (el) el.innerHTML = '';
}

// ══ 문장 편집/삭제 ══
function editPhrase(catId, phraseId) {
  const p = data.find(c=>c.id===catId)?.phrases.find(p=>p.id===phraseId);
  if (!p) return;
  const t = prompt('문장 수정', p.text);
  if (!t?.trim()) return;
  p.text = t.trim(); save(); render();
}
function deletePhrase(catId, phraseId) {
  const cat = data.find(c => c.id === catId);
  if (!cat) return;
  cat.phrases = cat.phrases.filter(p => p.id !== phraseId);
  save(); render();
}

// ══ 유틸 ══
function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n');
}

// ══ 시작 ══
render();
</script>
</body>
</html>
